<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linha do Tempo da Urna</title>
  <meta name="description" content="Mapa cronológico e interativo dos dados públicos das urnas eletrônicas (TSE), para análise independente.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css?v=20261103c">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-title">Linha do Tempo da Urna</div>
        <div class="brand-sub" id="election-name">Carregando…</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-about" type="button">Sobre os dados e o método</button>
    </div>
  </header>

  <!-- Timeline: the main control of the page -->
  <section class="timeline" aria-label="Linha do tempo">
    <div class="tl-head">
      <div class="tl-clock">
        <button class="icon-btn" id="tl-play" type="button" aria-label="Reproduzir">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="tl-play-icon" d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <div>
          <div class="tl-time" id="tl-time">--:--</div>
          <div class="tl-time-sub">horário de Brasília · <span id="tl-phase">—</span></div>
        </div>
      </div>
      <div class="tl-controls">
        <div class="seg" role="group" aria-label="Velocidade">
          <button type="button" data-speed="1">1×</button>
          <button type="button" data-speed="5" class="on">5×</button>
          <button type="button" data-speed="20">20×</button>
        </div>
        <div class="seg" role="group" aria-label="Modo do mapa" id="mode-seg">
          <button type="button" data-mode="auto" class="on">Automático</button>
          <button type="button" data-mode="vote">Votação</button>
          <button type="button" data-mode="count">Apuração</button>
        </div>
      </div>
    </div>
    <div class="tl-track" id="tl-track" tabindex="0" role="slider" aria-label="Horário" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <canvas id="tl-canvas"></canvas>
      <div class="tl-markers" id="tl-markers"></div>
      <div class="tl-handle" id="tl-handle"><span></span></div>
    </div>
  </section>

  <main class="layout">
    <section class="map-wrap">
      <div id="map" aria-label="Mapa"></div>

      <div class="map-toolbar">
        <nav class="crumbs" id="crumbs" aria-label="Navegação geográfica"></nav>
        <div class="regions" id="regions"></div>
      </div>

      <div class="map-filters">
        <div class="seg" role="group" aria-label="Métrica" id="metric-seg">
          <button type="button" data-metric="turnout" class="on">Comparecimento</button>
          <button type="button" data-metric="manual">Sem biometria</button>
          <button type="button" data-metric="fast">Votos rápidos</button>
        </div>
        <button type="button" class="chip" id="chip-manual" aria-pressed="false">
          <span class="chip-dot"></span>Somente votos sem biometria
        </button>
        <button type="button" class="chip amber" id="chip-fast" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>Destacar votos rápidos
        </button>
      </div>

      <div class="legend" id="legend"></div>
      <div class="map-note" id="map-note" hidden></div>
      <div class="tooltip" id="tooltip" hidden></div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-scroll">
        <div class="panel-head">
          <div class="panel-kicker" id="p-kicker">Brasil</div>
          <h1 class="panel-title" id="p-title">Brasil</h1>
          <div class="panel-sub" id="p-sub"></div>
        </div>
        <div id="p-body"></div>
      </div>
    </aside>
  </main>

  <dialog id="about" class="modal">
    <form method="dialog" class="modal-inner">
      <h2>Sobre os dados e o método</h2>
      <div id="about-body"></div>
      <div class="modal-actions"><button class="btn">Fechar</button></div>
    </form>
  </dialog>

  <script src="vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
  <script type="module" src="js/app.js?v=20261103c"></script>
</body>
</html>
